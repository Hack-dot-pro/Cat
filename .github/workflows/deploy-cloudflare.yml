name: Deploy CAT AI to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CAT AI
        run: npm run build
        env:
          VITE_AI_PROVIDER: ${{ secrets.VITE_AI_PROVIDER || 'xkiro' }}
          VITE_AI_BASE_URL: ${{ secrets.VITE_AI_BASE_URL || 'https://api.xkiro.com/v1' }}
          VITE_AI_API_KEY: ${{ secrets.VITE_AI_API_KEY }}
          VITE_AI_MODEL: ${{ secrets.VITE_AI_MODEL || 'Gwen 3.8 max' }}
          VITE_APP_TITLE: 'CAT AI'
          VITE_USER_FULL_NAME: 'Vinh'
          VITE_USER_NAME: 'Vinh_Admin'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=cat-ai
        continue-on-error: true
